<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale-=1.0" />
    <title>J Card Template</title>
    <link rel="stylesheet" type="text/css" href="public/jcardgen.css" />
  </head>
  <body class="container">
    <aside class="customizer-container">
      <section>
        <label for="background-image"></label>
        <input class="background-image" type="file" accept="image/*" />
      </section>
    </aside>
    <section class="template-container">
      <section class="heightWrapper">
        <section class="flap"></section>
        <section class="spine"></section>
        <section class="cover"></section>
      </section>
    </section>
  </body>
</html>
